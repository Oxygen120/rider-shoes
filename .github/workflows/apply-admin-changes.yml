name: Apply safe admin changes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/AdminWorkspaceV4.tsx')
          s=p.read_text()
          # Remove QR/bridge admin navigation and page.
          s=s.replace("| 'whatsapp'", "")
          s=s.replace("['whatsapp','WhatsApp',MessageCircle],", "")
          s=s.replace("{view==='whatsapp'&&<WhatsApp/>}", "")
          s=re.sub(r'function WhatsApp\(\).*?\nfunction Reports\(\)', 'function Reports()', s, flags=re.S)
          # Helpers for manual WhatsApp click-to-chat and image compression.
          s=s.replace("const norm=(v:string)=>v.replace(/\\D/g,'');", "const norm=(v:string)=>String(v||'').replace(/\\D/g,'');\nconst waNumber=(v:string)=>{const d=norm(v);return d.length===10?`91${d}`:d};\nasync function imageToWebp(file:File,size=1200){const b=await createImageBitmap(file),side=Math.min(b.width,b.height),canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Image processor unavailable');ctx.imageSmoothingQuality='high';ctx.drawImage(b,(b.width-side)/2,(b.height-side)/2,side,side,0,0,size,size);b.close();const blob=await new Promise<Blob>((ok,no)=>canvas.toBlob(x=>x?ok(x):no(Error('Image compression failed')),'image/webp',.82));return new File([blob],file.name.replace(/\\.[^.]+$/i,'.webp'),{type:'image/webp'})}\nconst orderWhatsApp=(o:any)=>{const n=waNumber(o.shipping_address?.phone);if(n.length<10)return '';const a=o.shipping_address||{};const text=[`Hello ${a.recipientName||'Customer'},`,`Rider Shoes order update 👟`,``,`Order: ${o.order_number||'—'}`,`Payment: ${String(o.payment_status||'').replaceAll('_',' ')||'—'}`,`Status: ${String(o.status||'').replaceAll('_',' ')||'—'}`,`Total: ${money(o.total_amount)}`,``,`Track: ${STORE}/track-order`].join('\\n');return `https://wa.me/${n}?text=${encodeURIComponent(text)}`}" )
          # Manual WhatsApp button in OrderModal.
          s=s.replace("const [busy,setBusy]=useState(false),[msg,setMsg]=useState('');useEffect", "const [busy,setBusy]=useState(false),[msg,setMsg]=useState('');const sendWhatsApp=()=>{const href=orderWhatsApp(order);if(!href){setMsg('Customer mobile number is missing or invalid.');return}window.open(href,'_blank','noopener,noreferrer')};useEffect")
          s=s.replace("<div className=\"v4-actions\"><button className=\"v4-danger\"", "<div className=\"v4-actions\"><button className=\"v4-whatsapp\" onClick={sendWhatsApp}><MessageCircle size={15}/> Send WhatsApp</button><button className=\"v4-danger\"")
          s=s.replace("Order updated. WhatsApp notification has been queued automatically.", "Order updated successfully. No WhatsApp message was sent automatically.")
          # Replace Products with image upload + compression while keeping existing CRUD/RPC flow.
          a=s.index('function Products()'); b=s.index('function Categories()',a)
          products=r'''function Products(){const [rows,setRows]=useState<any[]>([]),[cats,setCats]=useState<any[]>([]),[q,setQ]=useState(''),[open,setOpen]=useState(false),[edit,setEdit]=useState<any>(null),[form,setForm]=useState<any>({name:'',slug:'',description:'',categoryId:'',sku:'',sizes:'',price:'',stock:'',color:'Black'}),[imageFile,setImageFile]=useState<File|null>(null),[imagePreview,setImagePreview]=useState(''),[busy,setBusy]=useState(false),[msg,setMsg]=useState('');const load=async()=>{const c=getSupabaseClient();if(!c)return;const [p,k]=await Promise.all([c.from('products').select('id,name,slug,description,status,created_at,product_variants(id,sku,size,price,is_active),product_images(id,storage_path,alt_text,sort_order,is_primary)').order('created_at',{ascending:false}),c.from('categories').select('id,name').eq('is_active',true).order('sort_order')]);setRows(p.data||[]);setCats(k.data||[])};useEffect(()=>{void load()},[]);const start=(p?:any)=>{setEdit(p||null);setMsg('');setImageFile(null);const img=p?.product_images?.[0]?.storage_path||'';setImagePreview(/^https?:///i.test(img)?img:(img?getSupabaseClient()?.storage.from('product-images').getPublicUrl(img).data.publicUrl:''));const v=p?.product_variants?.[0];setForm({name:p?.name||'',slug:p?.slug||'',description:p?.description||'',categoryId:'',sku:v?.sku||`RS-${Date.now()}`,sizes:(p?.product_variants||[]).map((x:any)=>x.size).filter(Boolean).join(', '),price:v?.price??'',stock:'',color:v?.color||'Black'});setOpen(true)};const save=async()=>{const c=getSupabaseClient();if(!c)return;const name=String(form.name||'').trim();if(!name){setMsg('Product name is required.');return}const sizes=String(form.sizes||'').split(',').map((x:string)=>x.trim()).filter(Boolean);const variants=(sizes.length?sizes:['']).map((size:string,i:number)=>({id:i===0&&edit?.product_variants?.[0]?.id?edit.product_variants[0].id:undefined,sku:i===0?String(form.sku||`RS-${Date.now()}`):`${String(form.sku||`RS-${Date.now()}`)}-${i+1}`,size:size||null,color:String(form.color||'Black')||null,price:Number(form.price||0),compareAtPrice:null,currency:'INR',weightGrams:null,isActive:true,stockQuantity:Number(form.stock||0)}));setBusy(true);setMsg('');try{let images:any[]=[];if(edit?.product_images?.length){images=edit.product_images.map((x:any)=>{const raw=String(x.storage_path||'');return {url:/^https?:///i.test(raw)?raw:c.storage.from('product-images').getPublicUrl(raw).data.publicUrl,altText:x.alt_text||name,sortOrder:x.sort_order,isPrimary:x.is_primary}})}if(imageFile){const f=await imageToWebp(imageFile);const slug=String(form.slug||name).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const path=`products/${slug}/${crypto.randomUUID()}.webp`;const up=await c.storage.from('product-images').upload(path,f,{contentType:'image/webp',cacheControl:'31536000',upsert:false});if(up.error)throw up.error;images.push({url:c.storage.from('product-images').getPublicUrl(path).data.publicUrl,altText:name,sortOrder:images.length,isPrimary:images.length===0})}const payload={id:edit?.id||undefined,name,slug:String(form.slug||name).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),shortDescription:String(form.description||'').slice(0,240),description:String(form.description||''),status:'active',taxRate:0,categoryIds:form.categoryId?[form.categoryId]:[],images,variants};const r=await c.rpc('save_product',{_product:payload});if(r.error)throw r.error;setOpen(false);await load()}catch(e){setMsg(e instanceof Error?e.message:'Unable to save product')}finally{setBusy(false)}};return <><div className="v4-head"><div><small>CATALOG</small><h2>Products</h2></div><button className="v4-primary" onClick={()=>start()}><Plus size={15}/> Add product</button></div><Card title="Live products"><div className="v4-toolbar"><div className="v4-search"><Search size={15}/><input placeholder="Search" value={q} onChange={e=>setQ(e.target.value)}/></div></div><div className="v4-table"><table><thead><tr><th>Product</th><th>Variants</th><th>Price</th><th>Status</th><th/></tr></thead><tbody>{rows.filter(p=>String(p.name||'').toLowerCase().includes(q.toLowerCase())).map(p=><tr key={p.id}><td><b>{p.name}</b><small>{STORE}/product/{p.slug}</small></td><td>{(p.product_variants||[]).length}</td><td>{money(p.product_variants?.[0]?.price)}</td><td><Pill text={p.status}/></td><td><button className="v4-secondary" onClick={()=>start(p)}>Edit</button></td></tr>)}</tbody></table></div></Card>{open&&<div className="v4-overlay"><div className="v4-modal v4-glass-modal"><div className="v4-modal-head"><div><small>CATALOG</small><h2>{edit?'Edit product':'Add product'}</h2></div><button onClick={()=>setOpen(false)}><X/></button></div><div className="v4-image-picker"><div className="v4-image-preview">{imagePreview?<img src={imagePreview}/>:<Upload size={28}/>}</div><label className="v4-upload-button"><Upload size={15}/> {imageFile||imagePreview?'Change product image':'Add product image'}<input type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0];if(f){setImageFile(f);setImagePreview(URL.createObjectURL(f))}}}/></label></div><div className="v4-form-grid"><label>Name<input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></label><label>Slug<input value={form.slug} onChange={e=>setForm({...form,slug:e.target.value})}/></label><label>Category<select value={form.categoryId} onChange={e=>setForm({...form,categoryId:e.target.value})}><option value="">No category</option>{cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></label><label>SKU<input value={form.sku} onChange={e=>setForm({...form,sku:e.target.value})}/></label><label>Sizes <small>comma-separated</small><input value={form.sizes} onChange={e=>setForm({...form,sizes:e.target.value})} placeholder="6, 7, 8, 9, 10"/></label><label>Color<input value={form.color} onChange={e=>setForm({...form,color:e.target.value})}/></label><label>Price<input type="number" min="0" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}/></label><label>Stock per size<input type="number" min="0" value={form.stock} onChange={e=>setForm({...form,stock:e.target.value})}/></label></div><label className="v4-full-label">Description<textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={5}/></label>{msg&&<div className="v4-note">{msg}</div>}<div className="v4-actions"><button className="v4-secondary" onClick={()=>setOpen(false)}>Cancel</button><button className="v4-primary" disabled={busy} onClick={()=>void save()}>{busy?'Saving…':'Save product'}</button></div></div></div>}</>}'''
          s=s[:a]+products+'\n'+s[b:]
          # Replace Categories with image upload + glass modal.
          a=s.index('function Categories()'); b=s.index('function Customers()',a)
          cats=r'''function Categories(){const [rows,setRows]=useState<any[]>([]),[open,setOpen]=useState(false),[name,setName]=useState(''),[slug,setSlug]=useState(''),[description,setDescription]=useState(''),[imageFile,setImageFile]=useState<File|null>(null),[imagePreview,setImagePreview]=useState(''),[busy,setBusy]=useState(false),[msg,setMsg]=useState('');const load=()=>void getSupabaseClient()?.from('categories').select('*').order('sort_order').then(({data})=>setRows(data||[]));useEffect(()=>{load()},[]);const add=async()=>{const c=getSupabaseClient();if(!c||!name.trim())return;setBusy(true);setMsg('');try{const sl=slug.trim()||name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let image_url=null;if(imageFile){const f=await imageToWebp(imageFile,1000),path=`categories/${sl}-${crypto.randomUUID()}.webp`;const up=await c.storage.from('product-images').upload(path,f,{contentType:'image/webp',cacheControl:'31536000',upsert:false});if(up.error)throw up.error;image_url=c.storage.from('product-images').getPublicUrl(path).data.publicUrl}const r=await c.from('categories').insert({name:name.trim(),slug:sl,description:description.trim()||null,image_url,is_active:true,sort_order:rows.length});if(r.error)throw r.error;setName('');setSlug('');setDescription('');setImageFile(null);setImagePreview('');setOpen(false);load()}catch(e){setMsg(e instanceof Error?e.message:'Unable to add category')}finally{setBusy(false)}};return <><div className="v4-head"><div><small>CATALOG</small><h2>Categories</h2></div><button className="v4-primary" onClick={()=>setOpen(true)}><Plus size={15}/> Add category</button></div><Card title="Categories"><div className="v4-table"><table><thead><tr><th>Category</th><th>Image</th><th>Status</th></tr></thead><tbody>{rows.map(r=><tr key={r.id}><td><b>{r.name}</b><small>{r.slug}</small></td><td>{r.image_url?<img className="v4-thumb" src={r.image_url}/>:<span className="v4-muted">No image</span>}</td><td><Pill text={r.is_active?'active':'inactive'}/></td></tr>)}</tbody></table></div></Card>{open&&<div className="v4-overlay"><div className="v4-modal v4-glass-modal"><div className="v4-modal-head"><div><small>CATALOG</small><h2>Add category</h2></div><button onClick={()=>setOpen(false)}><X/></button></div><div className="v4-image-picker"><div className="v4-image-preview">{imagePreview?<img src={imagePreview}/>:<Upload size={28}/>}</div><label className="v4-upload-button"><Upload size={15}/> {imageFile?'Change category image':'Add category image'}<input type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0];if(f){setImageFile(f);setImagePreview(URL.createObjectURL(f))}}}/></label></div><div className="v4-form-grid"><label>Name<input value={name} onChange={e=>setName(e.target.value)} autoFocus/></label><label>Slug<input value={slug} onChange={e=>setSlug(e.target.value)}/></label></div><label className="v4-full-label">Description<textarea value={description} onChange={e=>setDescription(e.target.value)} rows={4}/></label>{msg&&<div className="v4-note">{msg}</div>}<div className="v4-actions"><button className="v4-secondary" onClick={()=>setOpen(false)}>Cancel</button><button className="v4-primary" disabled={busy||!name.trim()} onClick={()=>void add()}>{busy?'Saving…':'Save category'}</button></div></div></div>}</>}'''
          s=s[:a]+cats+'\n'+s[b:]
          # Customers = order/store-visit people, with email.
          a=s.index('function Customers()'); b=s.index('function Visits()',a)
          customers=r'''function Customers(){const [rows,setRows]=useState<any[]>([]),[q,setQ]=useState('');useEffect(()=>{const c=getSupabaseClient();if(!c)return;Promise.all([c.from('orders').select('id,created_at,shipping_address'),c.from('store_visits').select('id,occurred_at,customer_name,customer_phone,customer_email')]).then(([o,v])=>{const m=new Map<string,any>();for(const x of [...(o.data||[]).map((r:any)=>({name:r.shipping_address?.recipientName||'Customer',phone:r.shipping_address?.phone||'',email:r.shipping_address?.email||'',date:r.created_at,order:1}),...(v.data||[]).map((r:any)=>({name:r.customer_name||'Customer',phone:r.customer_phone||'',email:r.customer_email||'',date:r.occurred_at,visit:1}))]){const key=norm(x.phone)||String(x.email||'').toLowerCase()||`${x.name}-${x.date}`;const old=m.get(key);if(!old)m.set(key,{id:key,name:x.name,phone:x.phone,email:x.email,orders:x.order||0,visits:x.visit||0,lastDate:x.date});else{old.orders+=x.order||0;old.visits+=x.visit||0;old.phone=old.phone||x.phone;old.email=old.email||x.email;old.name=old.name==='Customer'?x.name:old.name;old.lastDate=new Date(old.lastDate)>new Date(x.date)?old.lastDate:x.date}}setRows([...m.values()].sort((a,b)=>new Date(b.lastDate).getTime()-new Date(a.lastDate).getTime()))})},[]);const list=rows.filter(r=>`${r.name} ${r.phone} ${r.email}`.toLowerCase().includes(q.toLowerCase()));return <><div className="v4-head"><div><small>CUSTOMERS</small><h2>Customers</h2><p>Customers from orders and store visits — not admin/auth users.</p></div></div><Card title="Customer directory"><div className="v4-search"><Search size={15}/><input placeholder="Search customer, mobile or email" value={q} onChange={e=>setQ(e.target.value)}/></div><div className="v4-table"><table><thead><tr><th>Customer</th><th>Mobile</th><th>Email</th><th>Orders</th><th>Visits</th><th>Last activity</th></tr></thead><tbody>{list.map(r=><tr key={r.id}><td><b>{r.name}</b></td><td>{r.phone||'—'}</td><td>{r.email||'—'}</td><td>{r.orders}</td><td>{r.visits}</td><td>{new Date(r.lastDate).toLocaleString('en-IN')}</td></tr>)}</tbody></table></div></Card></>}'''
          s=s[:a]+customers+'\n'+s[b:]
          # Glassy modal/upload styles.
          s=s.replace('.v4-modal{width:min(900px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 35px 100px rgba(0,0,0,.35)}','.v4-modal{width:min(900px,100%);max-height:92dvh;overflow:auto;background:rgba(247,251,250,.86);border:1px solid rgba(255,255,255,.72);border-radius:28px;padding:22px;box-shadow:0 35px 100px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(28px) saturate(140%)}.v4-glass-modal{background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(237,246,243,.76))}')
          s=s.replace('.v4-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}', '.v4-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.v4-whatsapp{border-radius:11px;padding:10px 13px;border:0;font-weight:800;font-size:10px;display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#1eae68,#168c54);color:#fff}.v4-image-picker{display:flex;align-items:center;gap:14px;margin:14px 0 18px;padding:14px;border-radius:18px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7)}.v4-image-preview{width:92px;height:92px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:rgba(12,24,26,.06);border:1px dashed rgba(70,90,88,.28);color:#718083}.v4-image-preview img{width:100%;height:100%;object-fit:cover}.v4-upload-button{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(90,110,108,.25);background:rgba(255,255,255,.68);padding:10px 13px;border-radius:12px;font-size:10px;font-weight:800;cursor:pointer}.v4-upload-button input{display:none}.v4-thumb{width:42px;height:42px;object-fit:cover;border-radius:10px;border:1px solid #dbe4e1}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminWorkspaceV4.tsx
          git commit -m 'Apply admin manual WhatsApp customer catalog updates'
          git push origin HEAD:main
