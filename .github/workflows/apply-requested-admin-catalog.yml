name: Apply requested admin catalog controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'APPLY REQUESTED ADMIN CATALOG')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only requested admin catalog features
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/AdminWorkspaceV4.tsx')
          s=p.read_text()
          s=s.replace("import {useEffect,useState} from 'react';", "import {useEffect,useRef,useState} from 'react';")
          s=s.replace("import {getSupabaseClient} from '../lib/supabase';", "import {getSupabaseClient} from '../lib/supabase';\nimport {Logo} from '../components/Ui';")

          old_header="<header><button className=\"v4-menu\" onClick={()=>setOpen(true)}><Menu size={18}/></button><div><small>RIDER SHOES · ADMIN</small><h1>{NAV.find(x=>x[0]===view)?.[1]}</h1></div><b>{user?.email||'OWNER'}</b></header>"
          new_header="<header><button className=\"v4-menu\" onClick={()=>setOpen(true)}><Menu size={18}/></button><div className=\"v4-site-brand\"><Logo light/><div><small>RIDER SHOES · ADMIN</small><h1>{NAV.find(x=>x[0]===view)?.[1]}</h1></div></div><b>{user?.email||'OWNER'}</b></header>"
          if old_header not in s: raise SystemExit('Admin header marker not found')
          s=s.replace(old_header,new_header,1)

          helper=r'''async function cropAndCompress(file:File,zoom:number,offsetX:number,offsetY:number,size=1200):Promise<File>{const bitmap=await createImageBitmap(file);const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');if(!ctx){bitmap.close();throw Error('Image processor unavailable')}ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);const base=Math.max(size/bitmap.width,size/bitmap.height);const scale=base*zoom;const ratio=size/320;const dx=(size-bitmap.width*scale)/2+offsetX*ratio;const dy=(size-bitmap.height*scale)/2+offsetY*ratio;ctx.imageSmoothingQuality='high';ctx.drawImage(bitmap,dx,dy,bitmap.width*scale,bitmap.height*scale);bitmap.close();const blob=await new Promise<Blob>((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Image compression failed')),'image/webp',.84));return new File([blob],file.name.replace(/\.[^.]+$/i,'.webp'),{type:'image/webp',lastModified:Date.now()})}
function CropModal({file,onDone,onCancel}:{file:File;onDone:(f:File)=>void;onCancel:()=>void}){const [zoom,setZoom]=useState(1),[x,setX]=useState(0),[y,setY]=useState(0);const start=useRef<any>(null);const pinch=useRef<any>(null);const img=useRef<HTMLImageElement|null>(null);const onTouchStart=(e:any)=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinch.current={dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),zoom};start.current=null}else if(e.touches.length===1){const t=e.touches[0];start.current={x:t.clientX,y:t.clientY,ox:x,oy:y}}};const onTouchMove=(e:any)=>{e.preventDefault();if(e.touches.length===2&&pinch.current){const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);setZoom(Math.min(4,Math.max(1,pinch.current.zoom*dist/pinch.current.dist)))}else if(e.touches.length===1&&start.current){const t=e.touches[0];setX(start.current.ox+t.clientX-start.current.x);setY(start.current.oy+t.clientY-start.current.y)}};const onWheel=(e:any)=>{e.preventDefault();setZoom(z=>Math.min(4,Math.max(1,z+(e.deltaY<0?.12:-.12))))};const confirm=async()=>{try{onDone(await cropAndCompress(file,zoom,x,y))}catch{onCancel()}};return <div className=\"v4-overlay\"><div className=\"v4-modal v4-crop-modal\"><div className=\"v4-modal-head\"><div><small>IMAGE CROP</small><h2>Adjust product photo</h2></div><button onClick={onCancel}><X/></button></div><p className=\"v4-muted\">Drag to position. Pinch or use the mouse wheel to zoom. The saved image is always square.</p><div className=\"v4-crop-area\" onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={()=>{start.current=null;pinch.current=null}} onWheel={onWheel}><img ref={img} src={URL.createObjectURL(file)} draggable={false} style={{transform:`translate(${x}px,${y}px) scale(${zoom})`}}/></div><div className=\"v4-actions\"><button className=\"v4-secondary\" onClick={onCancel}>Cancel</button><button className=\"v4-primary\" onClick={()=>void confirm()}>Use photo</button></div></div></div>}
'''
          marker="function Products()"
          if marker not in s: raise SystemExit('Products marker not found')
          s=s.replace(marker,helper+marker,1)

          a=s.index('function Products()')
          b=s.index('\nfunction Categories()',a)
          products=r'''function Products(){const [rows,setRows]=useState<any[]>([]),[cats,setCats]=useState<any[]>([]),[q,setQ]=useState(''),[open,setOpen]=useState(false),[edit,setEdit]=useState<any>(null),[form,setForm]=useState<any>({name:'',slug:'',description:'',categoryId:'',sku:'',price:'',status:'active',color:'Black'}),[variants,setVariants]=useState<any[]>([]),[images,setImages]=useState<any[]>([]),[queue,setQueue]=useState<File[]>([]),[busy,setBusy]=useState(false),[msg,setMsg]=useState('');const load=async()=>{const c=getSupabaseClient();if(!c)return;const [p,k]=await Promise.all([c.from('products').select('id,name,slug,description,status,created_at,product_variants(id,sku,size,price,is_active,option_values),product_images(id,storage_path,alt_text,sort_order,is_primary)').order('created_at',{ascending:false}),c.from('categories').select('id,name').eq('is_active',true).order('sort_order')]);setRows(p.data||[]);setCats(k.data||[])};useEffect(()=>{void load()},[]);const start=(p?:any)=>{setEdit(p||null);setMsg('');const v=p?.product_variants||[];setVariants(v.length?v.map((x:any)=>({id:x.id,size:x.size||'',quantity:Number(x.option_values?.stockQuantity??x.option_values?.stock_quantity??0),price:x.price??0,sku:x.sku||''})): [{size:'',quantity:0,price:'',sku:`RS-${Date.now()}`}]);setImages((p?.product_images||[]).sort((a:any,b:any)=>a.sort_order-b.sort_order).map((x:any)=>{const raw=String(x.storage_path||'');return {id:x.id,url:/^https?:\/\//i.test(raw)?raw:(raw?getSupabaseClient()?.storage.from('product-images').getPublicUrl(raw).data.publicUrl:''),storage_path:raw,isPrimary:Boolean(x.is_primary),altText:x.alt_text||''}}));const primary=v[0];setForm({name:p?.name||'',slug:p?.slug||'',description:p?.description||'',categoryId:'',sku:primary?.sku||`RS-${Date.now()}`,price:primary?.price??'',status:p?.status||'active',color:primary?.color||'Black'});setOpen(true)};const chooseFiles=(files:FileList|null)=>{const list=Array.from(files||[]).filter(f=>f.type.startsWith('image/')).slice(0,10);if(list.length)setQueue(list)};const finishCrop=async(f:File)=>{const c=getSupabaseClient();if(!c)return;const path=`${crypto.randomUUID()}.webp`;const up=await c.storage.from('product-images').upload(path,f,{contentType:'image/webp',upsert:false});if(up.error){setMsg(up.error.message);return}const url=c.storage.from('product-images').getPublicUrl(path).data.publicUrl;setImages(x=>[...x,{url,storage_path:path,isPrimary:x.length===0,altText:form.name||'Rider Shoes product'}]);setQueue(q=>q.slice(1))};const save=async()=>{const c=getSupabaseClient();if(!c)return;const name=String(form.name||'').trim();if(!name){setMsg('Product name is required.');return}const sizes=variants.length?variants:[{size:'',quantity:0,price:form.price||0,sku:form.sku||`RS-${Date.now()}`}];setBusy(true);setMsg('');try{const payload:any={id:edit?.id||crypto.randomUUID(),slug:String(form.slug||name).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),name,shortDescription:String(form.description||'').slice(0,180),description:String(form.description||''),status:form.status||'active',taxRate:18,brand:null,categoryIds:form.categoryId?[form.categoryId]:[],primaryCategoryId:form.categoryId||null,images:images.map((x:any,i:number)=>({id:x.id||crypto.randomUUID(),productId:edit?.id||null,url:x.url,storagePath:x.storage_path,altText:x.altText||name,sortOrder:i,isPrimary:i===0})),variants:sizes.map((v:any,i:number)=>({id:v.id||crypto.randomUUID(),productId:edit?.id||null,sku:String(v.sku||`${form.sku||'RS'}-${i+1}`),size:v.size||null,color:form.color||null,optionValues:{stockQuantity:Math.max(0,Number(v.quantity||0))},price:Number(v.price||0),compareAtPrice:null,currency:'INR',weightGrams:null,isActive:true}))};const r=await c.rpc('save_product',{_product:payload});if(r.error)throw r.error;await load();setOpen(false)}catch(e){setMsg(e instanceof Error?e.message:'Unable to save product')}finally{setBusy(false)}};const remove=async(p:any)=>{if(!confirm(`Delete ${p.name}?`))return;const c=getSupabaseClient();if(!c)return;setBusy(true);try{const a=await c.from('product_categories').delete().eq('product_id',p.id);if(a.error)throw a.error;const b=await c.from('product_images').delete().eq('product_id',p.id);if(b.error)throw b.error;const d=await c.from('product_variants').delete().eq('product_id',p.id);if(d.error)throw d.error;const z=await c.from('products').delete().eq('id',p.id);if(z.error)throw z.error;await load()}catch(e){setMsg(e instanceof Error?e.message:'Unable to delete product')}finally{setBusy(false)}};const toggle=async(p:any)=>{const c=getSupabaseClient();if(!c)return;const r=await c.from('products').update({status:p.status==='active'?'inactive':'active'}).eq('id',p.id);if(!r.error)await load()};const list=rows.filter(p=>`${p.name} ${p.slug}`.toLowerCase().includes(q.toLowerCase()));return <><div className="v4-head"><div><small>CATALOG</small><h2>Products</h2><p>{rows.length} products in the store.</p></div><button className="v4-primary" onClick={()=>start()}><Plus size={15}/> Add Product</button></div><Card title="Product catalog"><div className="v4-toolbar"><div className="v4-search"><Search size={15}/><input placeholder="Search products" value={q} onChange={e=>setQ(e.target.value)}/></div></div><div className="v4-table"><table><thead><tr><th>Product</th><th>Category</th><th>Sizes / Qty</th><th>Status</th><th/></tr></thead><tbody>{list.map(p=><tr key={p.id}><td><div className="v4-product-cell">{p.product_images?.[0]?.storage_path&&<img src={getSupabaseClient()?.storage.from('product-images').getPublicUrl(p.product_images[0].storage_path).data.publicUrl}/>}<b>{p.name}<small>{p.slug}</small></b></div></td><td>{cats.find(c=>c.id===p.category_id)?.name||'—'}</td><td>{(p.product_variants||[]).map((v:any)=><span key={v.id} className="v4-size-chip">{v.size||'One size'}: {Number(v.option_values?.stockQuantity??v.option_values?.stock_quantity??0)}</span>)}</td><td><button className={p.status==='active'?'v4-stock-on':'v4-stock-off'} onClick={()=>void toggle(p)}>{p.status==='active'?'In Stock':'Out of Stock'}</button></td><td><button className="v4-secondary" onClick={()=>start(p)}>Edit</button><button className="v4-danger" onClick={()=>void remove(p)}>Delete</button></td></tr>)}</tbody></table></div></Card>{open&&<div className="v4-overlay"><div className="v4-modal"><div className="v4-modal-head"><div><small>{edit?'EDIT PRODUCT':'NEW PRODUCT'}</small><h2>{edit?'Edit product':'Add product'}</h2></div><button onClick={()=>setOpen(false)}><X/></button></div><div className="v4-form-grid"><label>Product name<input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></label><label>Slug<input value={form.slug} onChange={e=>setForm({...form,slug:e.target.value})}/></label><label>Category<select value={form.categoryId} onChange={e=>setForm({...form,categoryId:e.target.value})}><option value="">Select category</option>{cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></label><label>Color<input value={form.color} onChange={e=>setForm({...form,color:e.target.value})}/></label><label className="v4-full">Description<textarea rows={4} value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/></label><label>Status<select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}><option value="active">In Stock</option><option value="inactive">Out of Stock</option></select></label></div><div className="v4-subcard"><div className="v4-subhead"><b>Size-wise quantity & price</b><button className="v4-secondary" onClick={()=>setVariants([...variants,{size:'',quantity:0,price:form.price||0,sku:`${form.sku||'RS'}-${variants.length+1}`}])}><Plus size={14}/> Add size</button></div>{variants.map((v,i)=><div className="v4-variant-row" key={v.id||i}><input placeholder="Size e.g. 7" value={v.size} onChange={e=>setVariants(variants.map((x,j)=>j===i?{...x,size:e.target.value}:x))}/><input type="number" min="0" placeholder="Quantity" value={v.quantity} onChange={e=>setVariants(variants.map((x,j)=>j===i?{...x,quantity:e.target.value}:x))}/><input type="number" min="0" placeholder="Price" value={v.price} onChange={e=>setVariants(variants.map((x,j)=>j===i?{...x,price:e.target.value}:x))}/><button className="v4-danger" onClick={()=>setVariants(variants.filter((_,j)=>j!==i))}><X size={14}/></button></div>)}</div><div className="v4-subcard"><div className="v4-subhead"><b>Product images</b><label className="v4-upload"><Upload size={14}/> Add multiple images<input type="file" accept="image/*" multiple hidden onChange={e=>chooseFiles(e.target.files)}/></label></div><div className="v4-image-grid">{images.map((im:any)=><div className="v4-image-tile" key={im.id||im.storage_path}><img src={im.url}/><small>{im.isPrimary?'Primary':'Gallery'}</small></div>)}</div></div>{msg&&<div className="v4-note">{msg}</div>}<div className="v4-actions"><button className="v4-secondary" onClick={()=>setOpen(false)}>Cancel</button><button className="v4-primary" disabled={busy} onClick={()=>void save()}>{busy?'Saving…':'Save product'}</button></div></div></div>}{queue[0]&&<CropModal file={queue[0]} onDone={f=>void finishCrop(f)} onCancel={()=>setQueue([])}/>}</>}
'''
          s=s[:a]+products+s[b:]

          a=s.index('function Categories()')
          b=s.index('\nfunction Customers()',a)
          categories=r'''function Categories(){const [rows,setRows]=useState<any[]>([]),[open,setOpen]=useState(false),[edit,setEdit]=useState<any>(null),[name,setName]=useState(''),[description,setDescription]=useState(''),[image,setImage]=useState<any>(null),[queue,setQueue]=useState<File[]>([]),[msg,setMsg]=useState('');const load=async()=>{const c=getSupabaseClient();if(!c)return;const {data}=await c.from('categories').select('*').order('sort_order');setRows(data||[])};useEffect(()=>{void load()},[]);const start=(r?:any)=>{setEdit(r||null);setName(r?.name||'');setDescription(r?.description||'');setImage(r?.image_url?{url:r.image_url,storage_path:''}:null);setMsg('');setOpen(true)};const choose=(f:FileList|null)=>{const x=Array.from(f||[]).filter(v=>v.type.startsWith('image/')).slice(0,1);if(x.length)setQueue(x)};const finish=async(f:File)=>{const c=getSupabaseClient();if(!c)return;const path=`${crypto.randomUUID()}.webp`;const up=await c.storage.from('category-images').upload(path,f,{contentType:'image/webp',upsert:false});if(up.error){setMsg(up.error.message);return}const url=c.storage.from('category-images').getPublicUrl(path).data.publicUrl;setImage({url,storage_path:path});setQueue([])};const save=async()=>{const c=getSupabaseClient();if(!c)return;const n=name.trim();if(!n){setMsg('Category name is required.');return}const slug=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const r=edit?await c.from('categories').update({name:n,slug,description,image_url:image?.url||null}).eq('id',edit.id):await c.from('categories').insert({name:n,slug,description,image_url:image?.url||null,sort_order:rows.length,is_active:true});if(r.error){setMsg(r.error.message);return}await load();setOpen(false)};const remove=async(r:any)=>{if(!confirm(`Delete ${r.name}?`))return;const c=getSupabaseClient();if(!c)return;const linked=await c.from('product_categories').select('product_id').eq('category_id',r.id).limit(1);if(linked.data?.length){setMsg('This category is used by a product. Edit the product category first.');return}const x=await c.from('categories').delete().eq('id',r.id);if(x.error)setMsg(x.error.message);else await load()};return <><div className="v4-head"><div><small>CATALOG</small><h2>Categories</h2><p>Manage storefront categories and images.</p></div><button className="v4-primary" onClick={()=>start()}><Plus size={15}/> Add Category</button></div><Card title="Category catalog"><div className="v4-table"><table><thead><tr><th>Category</th><th>Description</th><th>Status</th><th/></tr></thead><tbody>{rows.map(r=><tr key={r.id}><td><div className="v4-product-cell">{r.image_url&&<img src={r.image_url}/>}<b>{r.name}<small>{r.slug}</small></b></div></td><td>{r.description||'—'}</td><td><Pill text={r.is_active?'active':'inactive'}/></td><td><button className="v4-secondary" onClick={()=>start(r)}>Edit</button><button className="v4-danger" onClick={()=>void remove(r)}>Delete</button></td></tr>)}</tbody></table></div></Card>{open&&<div className="v4-overlay"><div className="v4-modal"><div className="v4-modal-head"><div><small>{edit?'EDIT CATEGORY':'NEW CATEGORY'}</small><h2>{edit?'Edit category':'Add category'}</h2></div><button onClick={()=>setOpen(false)}><X/></button></div><div className="v4-form-grid"><label>Category name<input value={name} onChange={e=>setName(e.target.value)}/></label><label>Description<input value={description} onChange={e=>setDescription(e.target.value)}/></label></div><div className="v4-subcard"><div className="v4-subhead"><b>Category image</b><label className="v4-upload"><Upload size={14}/> Choose image<input type="file" accept="image/*" hidden onChange={e=>choose(e.target.files)}/></label></div>{image?.url&&<div className="v4-category-preview"><img src={image.url}/></div>}</div>{msg&&<div className="v4-note">{msg}</div>}<div className="v4-actions"><button className="v4-secondary" onClick={()=>setOpen(false)}>Cancel</button><button className="v4-primary" onClick={()=>void save()}>Save category</button></div></div></div>}{queue[0]&&<CropModal file={queue[0]} onDone={f=>void finish(f)} onCancel={()=>setQueue([])}/>}</>}
'''
          s=s[:a]+categories+s[b:]

          # Add only the CSS needed by the requested controls, preserving all existing CSS.
          css_add='''.v4-site-brand{display:flex;align-items:center;gap:12px}.v4-site-brand .brand-logo{margin:0}.v4-site-brand .bra{display:block}.v4-subcard{margin-top:16px;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.04)}.v4-subhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.v4-variant-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:8px 0}.v4-image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.v4-image-tile{padding:8px;border-radius:14px;background:rgba(255,255,255,.06);text-align:center}.v4-image-tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.v4-product-cell{display:flex;align-items:center;gap:10px}.v4-product-cell img{width:48px;height:48px;object-fit:cover;border-radius:10px}.v4-product-cell b{display:flex;flex-direction:column}.v4-product-cell small{opacity:.6;font-weight:400}.v4-size-chip{display:inline-block;margin:2px 4px 2px 0;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px}.v4-stock-on,.v4-stock-off{border:0;border-radius:999px;padding:7px 10px;cursor:pointer}.v4-stock-on{background:rgba(50,200,120,.15);color:#48d88d}.v4-stock-off{background:rgba(255,90,90,.15);color:#ff7777}.v4-upload{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.08)}.v4-category-preview{width:180px;height:180px}.v4-category-preview img{width:100%;height:100%;object-fit:cover;border-radius:14px}.v4-crop-area{width:320px;height:320px;max-width:90vw;max-height:60vh;margin:14px auto;overflow:hidden;border-radius:18px;background:#111;position:relative;touch-action:none;display:flex;align-items:center;justify-content:center}.v4-crop-area:after{content:'';position:absolute;inset:0;border:2px solid rgba(255,255,255,.75);border-radius:18px;pointer-events:none}.v4-crop-area img{width:100%;height:100%;object-fit:cover;user-select:none;touch-action:none;will-change:transform}.v4-crop-modal{max-height:92vh;overflow:auto}@media(max-width:700px){.v4-variant-row{grid-template-columns:1fr 1fr}.v4-site-brand h1{font-size:18px}.v4-crop-area{width:min(82vw,320px);height:min(82vw,320px)}}'''
          s=s.replace('</style></div></div>',css_add+'</style></div></div>')
          p.write_text(s)
      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-requested-admin-catalog.yml TEMP_ADMIN_CATALOG_TRIGGER.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminWorkspaceV4.tsx .github/workflows TEMP_ADMIN_CATALOG_TRIGGER.txt
          git commit -m 'Implement requested admin catalog controls'
          git push origin HEAD:main
