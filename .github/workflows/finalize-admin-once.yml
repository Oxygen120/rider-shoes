name: Finalize admin once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'FINALIZE ADMIN PATCH')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore patched admin and correct final issues
        run: |
          git checkout 27298d6f26c89e39f5763e6c821c6b53f543ce28 -- src/pages/AdminWorkspaceV4.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminWorkspaceV4.tsx')
          s=p.read_text()
          s=s.replace('/^https?:///i','/^https?:\\/\\//i')
          needle="const [busy,setBusy]=useState(false),[msg,setMsg]=useState('');"
          if 'const sendWhatsApp=' not in s:
              s=s.replace(needle,needle+"const sendWhatsApp=()=>{const href=orderWhatsApp(order);if(!href){setMsg('Customer mobile number is missing or invalid.');return}window.open(href,'_blank','noopener,noreferrer')};",1)
          s=s.replace('Order notifications are queued automatically for confirmation, payment success and status changes. Connect the QR-linked WhatsApp bridge from the WhatsApp page to start sending.','WhatsApp is manual. Open an order and use Send WhatsApp only when you want to contact that customer. No automatic WhatsApp sending is configured here.')
          p.write_text(s)
          PY
          rm -f .github/workflows/finalize-admin-once.yml TEMP_PATCH_TRIGGER.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminWorkspaceV4.tsx .github/workflows TEMP_PATCH_TRIGGER.txt
          git commit -m 'Finalize admin manual WhatsApp and catalog changes'
          git push origin HEAD:main
