name: Finalize Rider Shoes admin patch
on:
  workflow_run:
    workflows: ["Apply safe admin changes"]
    types: [completed]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Finalize source and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminWorkspaceV4.tsx')
          s=p.read_text()
          s=s.replace('/^https?:///i','/^https?:\\/\\//i')
          needle="const [busy,setBusy]=useState(false),[msg,setMsg]=useState('');"
          if 'const sendWhatsApp=' not in s and needle in s:
              s=s.replace(needle, needle+"const sendWhatsApp=()=>{const href=orderWhatsApp(order);if(!href){setMsg('Customer mobile number is missing or invalid.');return}window.open(href,'_blank','noopener,noreferrer')};",1)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-admin-changes.yml .github/workflows/restore-admin-baseline.yml .github/workflows/fix-admin-generated-regex.yml .github/workflows/finalize-admin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminWorkspaceV4.tsx .github/workflows
          git commit -m 'Finalize admin changes and remove temporary workflows' || exit 0
          git push origin HEAD:main
