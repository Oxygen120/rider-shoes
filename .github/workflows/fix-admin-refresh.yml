name: Fix admin refresh routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin view persistence
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/AdminWorkspaceV4.tsx')
          s = p.read_text(encoding='utf-8')
          old = "function AdminShell({user,logout}:{user:any;logout:()=>void}){const [view,setView]=useState<View>('dashboard'),[open,setOpen]=useState(false);"
          new = "function AdminShell({user,logout}:{user:any;logout:()=>void}){const viewFromPath=():View=>{const raw=window.location.pathname.replace(/^\\/admin\\/?/,'').split('/')[0]||'dashboard';return NAV.some(x=>x[0]===raw)?raw as View:'dashboard'};const [view,setView]=useState<View>(viewFromPath);const [open,setOpen]=useState(false);useEffect(()=>{const onPop=()=>setView(viewFromPath());window.addEventListener('popstate',onPop);return()=>window.removeEventListener('popstate',onPop)},[]);const changeView=(next:View)=>{setView(next);const target=next==='dashboard'?'/admin':`/admin/${next}`;if(window.location.pathname!==target)window.history.pushState({},'',target)};"
          if old not in s:
              raise SystemExit('Expected AdminShell signature was not found; no changes made.')
          s = s.replace(old, new, 1)
          old_click = "onClick={()=>{setView(k);setOpen(false)}}"
          new_click = "onClick={()=>{changeView(k);setOpen(false)}}"
          if old_click not in s:
              raise SystemExit('Expected admin navigation handler was not found; no changes made.')
          s = s.replace(old_click, new_click, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-admin-refresh.yml
          git add src/pages/AdminWorkspaceV4.tsx .github/workflows/fix-admin-refresh.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix admin page persistence on refresh"
          git push
