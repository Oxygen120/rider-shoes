name: One-time admin catalog fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AdminWorkspaceV4
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminWorkspaceV4.tsx')
          s = p.read_text()

          products_start = s.index('function Products(){')
          categories_start = s.index('function Categories(){', products_start)
          customers_start = s.index('function Customers(){', categories_start)
          visits_start = s.index('function Visits(){', customers_start)

          products = r'''function Products(){
            const [rows,setRows]=useState<any[]>([]),[cats,setCats]=useState<any[]>([]),[q,setQ]=useState(''),[open,setOpen]=useState(false),[edit,setEdit]=useState<any>(null),[form,setForm]=useState<any>({name:'',slug:'',description:'',categoryId:'',sku:'',sizes:'',price:'',stock:'',color:'Black'}),[busy,setBusy]=useState(false),[msg,setMsg]=useState('');
            const load=async()=>{const c=getSupabaseClient();if(!c)return;const [p,k]=await Promise.all([c.from('products').select('id,name,slug,description,status,created_at,product_variants(id,sku,size,price,is_active)').order('created_at',{ascending:false}),c.from('categories').select('id,name').eq('is_active',true).order('sort_order')]);setRows(p.data||[]);setCats(k.data||[])};
            useEffect(()=>{void load()},[]);
            const start=(p?:any)=>{setMsg('');setEdit(p||null);const v=p?.product_variants?.[0];setForm({name:p?.name||'',slug:p?.slug||'',description:p?.description||'',categoryId:'',sku:v?.sku||`RS-${Date.now()}`,sizes:(p?.product_variants||[]).map((x:any)=>x.size).filter(Boolean).join(', '),price:v?.price??'',stock:'',color:v?.color||'Black'});setOpen(true)};
            const save=async()=>{const c=getSupabaseClient();if(!c)return;const name=String(form.name||'').trim();if(!name){setMsg('Product name is required.');return}const sizes=String(form.sizes||'').split(',').map((x:string)=>x.trim()).filter(Boolean);const variants=(sizes.length?sizes:['']).map((size:string,i:number)=>({id:i===0&&edit?.product_variants?.[0]?.id?edit.product_variants[0].id:undefined,sku:i===0?String(form.sku||`RS-${Date.now()}`):`${String(form.sku||`RS-${Date.now()}`)}-${i+1}`,size:size||null,color:String(form.color||'Black')||null,price:Number(form.price||0),compareAtPrice:null,currency:'INR',weightGrams:null,isActive:true,stockQuantity:Number(form.stock||0)}));setBusy(true);setMsg('');try{const payload={id:edit?.id||undefined,name,slug:String(form.slug||name).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),shortDescription:String(form.description||'').slice(0,240),description:String(form.description||''),status:'active',taxRate:0,categoryIds:form.categoryId?[form.categoryId]:[],variants};const r=await c.rpc('save_product',{_product:payload});if(r.error)throw r.error;setOpen(false);await load()}catch(e){setMsg(e instanceof Error?e.message:'Unable to save product')}finally{setBusy(false)}};
            return <><div className="v4-head"><div><small>CATALOG</small><h2>Products</h2></div><button className="v4-primary" onClick={()=>start()}>+ Add product</button></div><Card title="Live products"><div className="v4-toolbar"><div className="v4-search"><Search size={15}/><input placeholder="Search" value={q} onChange={e=>setQ(e.target.value)}/></div></div><div className="v4-table"><table><thead><tr><th>Product</th><th>Variants</th><th>Price</th><th>Status</th><th/></tr></thead><tbody>{rows.filter(p=>String(p.name||'').toLowerCase().includes(q.toLowerCase())).map(p=><tr key={p.id}><td><b>{p.name}</b><small>{STORE}/product/{p.slug}</small></td><td>{(p.product_variants||[]).length}</td><td>{money(p.product_variants?.[0]?.price)}</td><td><Pill text={p.status}/></td><td><button className="v4-secondary" onClick={()=>start(p)}>Edit</button></td></tr>)}</tbody></table></div></Card>{open&&<div className="v4-overlay"><div className="v4-modal"><div className="v4-modal-head"><div><small>CATALOG</small><h2>{edit?'Edit product':'Add product'}</h2></div><button onClick={()=>setOpen(false)}><X/></button></div><div className="v4-form-grid"><label>Name<input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></label><label>Slug<input value={form.slug} onChange={e=>setForm({...form,slug:e.target.value})}/></label><label>Category<select value={form.categoryId} onChange={e=>setForm({...form,categoryId:e.target.value})}><option value="">No category</option>{cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></label><label>SKU<input value={form.sku} onChange={e=>setForm({...form,sku:e.target.value})}/></label><label>Sizes <small>comma-separated</small><input value={form.sizes} onChange={e=>setForm({...form,sizes:e.target.value})} placeholder="6, 7, 8, 9, 10"/></label><label>Color<input value={form.color} onChange={e=>setForm({...form,color:e.target.value})}/></label><label>Price<input type="number" min="0" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}/></label><label>Stock per size<input type="number" min="0" value={form.stock} onChange={e=>setForm({...form,stock:e.target.value})}/></label></div><label>Description<textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={5}/></label>{msg&&<div className="v4-note">{msg}</div>}<div className="v4-actions"><button className="v4-secondary" onClick={()=>setOpen(false)}>Cancel</button><button className="v4-primary" disabled={busy} onClick={()=>void save()}>{busy?'Saving…':'Save product'}</button></div></div></div>}</>;
          }
          '''

          categories = r'''function Categories(){
            const [rows,setRows]=useState<any[]>([]),[open,setOpen]=useState(false),[name,setName]=useState(''),[slug,setSlug]=useState(''),[description,setDescription]=useState(''),[busy,setBusy]=useState(false),[msg,setMsg]=useState('');
            const load=()=>void getSupabaseClient()?.from('categories').select('*').order('sort_order').then(({data})=>setRows(data||[]));useEffect(()=>{load()},[]);
            const add=async()=>{const c=getSupabaseClient();if(!c||!name.trim())return;setBusy(true);setMsg('');const s=slug.trim()||name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const r=await c.from('categories').insert({name:name.trim(),slug:s,description:description.trim()||null,is_active:true,sort_order:rows.length});if(r.error)setMsg(r.error.message);else{setName('');setSlug('');setDescription('');setOpen(false);load()}setBusy(false)};
            return <><div className="v4-head"><div><small>CATALOG</small><h2>Categories</h2></div><button className="v4-primary" onClick={()=>{setMsg('');setOpen(true)}}>+ Add category</button></div><Card title="Categories"><div className="v4-table"><table><thead><tr><th>Category</th><th>Status</th></tr></thead><tbody>{rows.map(r=><tr key={r.id}><td><b>{r.name}</b><small>{r.slug}</small></td><td><Pill text={r.is_active?'active':'inactive'}/></td></tr>)}</tbody></table></div></Card>{open&&<div className="v4-overlay"><div className="v4-modal"><div className="v4-modal-head"><div><small>CATALOG</small><h2>Add category</h2></div><button onClick={()=>setOpen(false)}><X/></button></div><div className="v4-form-grid"><label>Name<input value={name} onChange={e=>setName(e.target.value)} autoFocus/></label><label>Slug<input value={slug} onChange={e=>setSlug(e.target.value)}/></label></div><label>Description<textarea value={description} onChange={e=>setDescription(e.target.value)} rows={4}/></label>{msg&&<div className="v4-note">{msg}</div>}<div className="v4-actions"><button className="v4-secondary" onClick={()=>setOpen(false)}>Cancel</button><button className="v4-primary" disabled={busy||!name.trim()} onClick={()=>void add()}>{busy?'Saving…':'Save category'}</button></div></div></div>}</>;
          }
          '''

          customers = r'''function Customers(){
            const [rows,setRows]=useState<any[]>([]),[q,setQ]=useState('');
            useEffect(()=>{void getSupabaseClient()?.from('profiles').select('id,email,full_name,phone,is_active,created_at').order('created_at',{ascending:false}).then(({data})=>setRows(data||[]))},[]);
            const list=rows.filter(r=>`${r.full_name||''} ${r.phone||''} ${r.email||''}`.toLowerCase().includes(q.toLowerCase()));
            return <><div className="v4-head"><div><small>CUSTOMERS</small><h2>Customers</h2><p>Customer directory — not staff or admin users.</p></div></div><Card title="Customer directory"><div className="v4-toolbar"><div className="v4-search"><Search size={15}/><input placeholder="Search customer, mobile or email" value={q} onChange={e=>setQ(e.target.value)}/></div></div><div className="v4-table"><table><thead><tr><th>Customer</th><th>Mobile</th><th>Email</th><th>Status</th></tr></thead><tbody>{list.map(r=><tr key={r.id}><td><b>{r.full_name||'Customer'}</b><small>{r.created_at?new Date(r.created_at).toLocaleDateString('en-IN'):''}</small></td><td>{r.phone||'—'}</td><td>{r.email||'—'}</td><td><Pill text={r.is_active?'active':'inactive'}/></td></tr>)}</tbody></table></div></Card></>;
          }
          '''

          s = s[:products_start] + products + categories + customers + s[visits_start:]
          p.write_text(s)
          PY
      - name: Commit patched file and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminWorkspaceV4.tsx .github/workflows/one-time-admin-catalog-fix.yml
          git commit -m 'Restore admin catalog CRUD and customer directory'
          git rm .github/workflows/one-time-admin-catalog-fix.yml
          git commit -m 'Remove one-time admin catalog patch workflow'
          git push