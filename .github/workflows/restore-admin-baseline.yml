name: Restore known-good admin baseline
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore baseline
        run: |
          git checkout 86dadc12d60a0198ae3d3b0ed148204fa37c3f72 -- src/pages/AdminWorkspaceV4.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminWorkspaceV4.tsx
          git commit -m 'Restore known-good admin workspace' || exit 0
          git push origin HEAD:main
